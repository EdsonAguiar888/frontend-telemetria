



<div class="container">
  <h2>🏢 Gerenciamento de Imóveis</h2>

  <mat-card class="form-card">
    <mat-card-header>
      <mat-card-title>{{ imovelEditandoId ? 'Editar Imóvel' : 'Novo Imóvel' }}</mat-card-title>
    </mat-card-header>
    <mat-card-content class="form-content">
      <mat-form-field appearance="outline">
        <mat-label>Nome do Imóvel</mat-label>
        <input matInput [(ngModel)]="novoImovel.nome" placeholder="Ex: Matriz Centro" required />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Endereço</mat-label>
        <input matInput [(ngModel)]="novoImovel.endereco" placeholder="Ex: Av. Boa Viagem, 100" required />
      </mat-form-field>

      <div class="form-actions">
        <button mat-raised-button color="primary" (click)="salvar()">
          {{ imovelEditandoId ? 'Atualizar' : 'Salvar Imóvel' }}
        </button>
        <button mat-button *ngIf="imovelEditandoId" (click)="limparFormulario()">
          Cancelar
        </button>
      </div>
    </mat-card-content>
  </mat-card>

  <mat-card class="table-card">
    <mat-card-content class="table-content">

      <mat-form-field appearance="outline" class="busca">
        <mat-label>Buscar imóvel por nome ou endereço</mat-label>
        <input matInput [(ngModel)]="filtro" (keyup)="aplicarFiltro()" placeholder="Digite para filtrar..." />
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
      
      <!-- <div class="filter-header">
        <mat-form-field appearance="outline" class="search-field">
          <mat-label>Buscar imóvel por nome ou endereço</mat-label>
          <input matInput [(ngModel)]="filtro" (keyup)="aplicarFiltro()" placeholder="Digite para filtrar..." />
          <mat-icon matSuffix>search</mat-icon>
        </mat-form-field>
      </div> -->

      <table mat-table [dataSource]="imoveisFiltrados" class="mat-elevation-z1">
        <ng-container matColumnDef="nome">
          <th mat-header-cell *matHeaderCellDef>Nome</th>
          <td mat-cell *matCellDef="let imovel">{{ imovel.nome }}</td>
        </ng-container>

        <ng-container matColumnDef="endereco">
          <th mat-header-cell *matHeaderCellDef>Endereço</th>
          <td mat-cell *matCellDef="let imovel">{{ imovel.endereco }}</td>
        </ng-container>

        <ng-container matColumnDef="medidoresCount">
          <th mat-header-cell *matHeaderCellDef>Medidores</th>
          <td mat-cell *matCellDef="let imovel">{{ imovel.medidores?.length || 0 }}</td>
        </ng-container>

        <ng-container matColumnDef="acoes">
          <th mat-header-cell *matHeaderCellDef>Ações</th>
          <td mat-cell *matCellDef="let imovel">
            <button mat-icon-button color="primary" (click)="editar(imovel)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="excluir(imovel.id)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell empty-message" colspan="4">
            Nenhum imóvel encontrado.
          </td>
        </tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
