<div class="container">
  <h2>🏢 Gerenciamento de Imóveis</h2>

  <mat-card class="card-formulario">
    <mat-card-header>
      <mat-card-title>
        {{ imovelEditandoId ? 'Editar Imóvel' : 'Novo Imóvel' }}
      </mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form (ngSubmit)="salvar()" class="form-grid">
        <mat-form-field appearance="outline">
          <mat-label>Nome do Imóvel</mat-label>
          <input
            matInput
            [(ngModel)]="novoImovel.nome"
            name="nome"
            placeholder="Ex: Matriz Centro"
            required
          />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Endereço</mat-label>
          <input
            matInput
            [(ngModel)]="novoImovel.endereco"
            name="endereco"
            placeholder="Ex: Av. Boa Viagem, 100"
            required
          />
        </mat-form-field>

        <div class="acoes-form">
          <button mat-raised-button color="primary" type="submit">
            {{ imovelEditandoId ? 'Atualizar' : 'Salvar Imóvel' }}
          </button>
          <button
            mat-button
            type="button"
            *ngIf="imovelEditandoId"
            (click)="limparFormulario()"
          >
            Cancelar
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>

  <mat-card class="card-tabela">
    <mat-card-content>
      <mat-form-field appearance="outline" class="busca">
        <mat-label>Buscar imóvel por nome ou endereço</mat-label>
        <input
          matInput
          [(ngModel)]="filtro"
          (keyup)="aplicarFiltro()"
          placeholder="Digite para filtrar..."
        />
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>

      <table mat-table [dataSource]="imoveisFiltrados" class="mat-elevation-z2">
        <ng-container matColumnDef="nome">
          <th mat-header-cell *matHeaderCellDef>Nome</th>
          <td mat-cell *matCellDef="let imovel">{{ imovel.nome }}</td>
        </ng-container>

        <ng-container matColumnDef="endereco">
          <th mat-header-cell *matHeaderCellDef>Endereço</th>
          <td mat-cell *matCellDef="let imovel">{{ imovel.endereco }}</td>
        </ng-container>

        <ng-container matColumnDef="medidoresCount">
          <th mat-header-cell *matHeaderCellDef>Medidores</th>
          <td mat-cell *matCellDef="let imovel">
            {{ imovel.medidores?.length || 0 }}
          </td>
        </ng-container>

        <ng-container matColumnDef="acoes">
          <th mat-header-cell *matHeaderCellDef>Ações</th>
          <td mat-cell *matCellDef="let imovel">
            <button
              mat-icon-button
              color="primary"
              (click)="editar(imovel)"
              title="Editar"
            >
              <mat-icon>edit</mat-icon>
            </button>
            <button
              mat-icon-button
              color="warn"
              (click)="excluir(imovel.id)"
              title="Excluir"
            >
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell empty-message" colspan="4">
            Nenhum imóvel encontrado.
          </td>
        </tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
