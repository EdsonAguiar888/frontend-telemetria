<div class="app-container">
  <!-- Topbar Superior -->
  <header class="topbar">
    <div class="topbar-brand">
      <button mat-icon-button (click)="sidenav.toggle()" class="menu-toggle">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="app-title">⚡ Sistema de Telemetria de Consumo</span>
    </div>

    <div class="topbar-actions">
      <button mat-icon-button title="Notificações">
        <mat-icon>notifications</mat-icon>
      </button>
      <div class="user-profile">
        <mat-icon>account_circle</mat-icon>
        <span class="user-name">Usuário</span>
      </div>
    </div>
  </header>

  <!-- Corpo com Sidebar e Conteúdo Principal -->
  <mat-sidenav-container class="sidenav-container">
    <mat-sidenav #sidenav mode="side" opened class="sidebar">
      <div class="sidebar-header">
        <span>Navegação</span>
      </div>
      <mat-nav-list>
        <a mat-list-item routerLink="/imoveis" routerLinkActive="active-link">
          <mat-icon matListItemIcon>home</mat-icon>
          <span >Imóveis</span>
          <!-- <span matListItemTitle>Imóveis</span> -->
        </a>
        <a mat-list-item routerLink="/medidores" routerLinkActive="active-link">
          <mat-icon matListItemIcon>speed</mat-icon>
          <span matListItemTitle>Medidores</span>
        </a>
        <a mat-list-item routerLink="/leituras" routerLinkActive="active-link">
          <mat-icon matListItemIcon>bar_chart</mat-icon>
          <span matListItemTitle>Leituras</span>
        </a>
        <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link">
          <mat-icon matListItemIcon>dashboard</mat-icon>
          <span matListItemTitle>Dashboard</span>
        </a>
      </mat-nav-list>
    </mat-sidenav>



    <!-- Conteúdo + Rodapé -->
    <mat-sidenav-content class="main-content">
      <div class="content-wrapper">
        <main class="page-body">
          <router-outlet></router-outlet>
        </main>

      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>

        <router-outlet></router-outlet>

    </mat-sidenav-content>
  </mat-sidenav-container> -->
</div>
